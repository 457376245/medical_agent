server.port=8080

# Logging encoding for Windows compatibility
logging.charset.console=UTF-8
logging.charset.file=UTF-8

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:15432/medical_agent}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:127.0.0.1:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:root}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.connection-timeout=${RABBITMQ_CONNECTION_TIMEOUT:5000}
spring.rabbitmq.listener.simple.auto-startup=${APP_MQ_LISTENER_ENABLED:true}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# For local demo; set APP_SECURITY_ENABLED=true in stricter environments.
app.security.enabled=${APP_SECURITY_ENABLED:false}
app.security.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000}
app.oss.enabled=${APP_OSS_ENABLED:false}
app.oss.endpoint=${APP_OSS_ENDPOINT:${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}}
app.oss.bucket=${APP_OSS_BUCKET:${OSS_BUCKET:medical-agent-hjh}}
app.oss.access-key-id=${APP_OSS_ACCESS_KEY_ID:${OSS_ACCESS_KEY_ID:}}
app.oss.access-key-secret=${APP_OSS_ACCESS_KEY_SECRET:${OSS_ACCESS_KEY_SECRET:}}
app.oss.url-expire-seconds=${APP_OSS_URL_EXPIRE_SECONDS:900}
app.agent.base-url=${APP_AGENT_BASE_URL:http://127.0.0.1:8090}
app.parse.retry.enabled=${APP_PARSE_RETRY_ENABLED:true}
app.parse.retry.fixed-delay-ms=${APP_PARSE_RETRY_FIXED_DELAY_MS:60000}
app.parse.retry.max-retry-count=${APP_PARSE_RETRY_MAX_RETRY_COUNT:3}
app.parse.retry.batch-size=${APP_PARSE_RETRY_BATCH_SIZE:20}

storage.encryption.enabled=${STORAGE_ENCRYPTION_ENABLED:true}
database.encryption.enabled=${DATABASE_ENCRYPTION_ENABLED:true}
mybatis-plus.configuration.map-underscore-to-camel-case=true

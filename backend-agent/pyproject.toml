[project]
name = "medical-agent-backend"
version = "0.1.0"
description = "FastAPI backend service for the medical agent project."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.2",
    "uvicorn[standard]==0.31.1",
    "pydantic==2.9.2",
    "langchain==1.2.10",
    "langchain-google-genai==4.2.1",
    "langgraph==1.0.9",
    "langgraph-checkpoint-sqlite==3.0.3",
    "aiosqlite==0.20.0",
    "aio-pika==9.4.3",
    "oss2==2.19.1",
    "pypdf==5.1.0",
    "pymupdf==1.24.14",
    "google-cloud-vision==3.7.4",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-instrumentation-fastapi==0.48b0",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
]

[tool.uv]
package = false

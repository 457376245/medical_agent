asyncapi: 2.6.0
info:
  title: Medical Agent MVP Event Contracts
  version: 1.0.0
  description: Versioned RabbitMQ event contracts between backend-java and backend-agent.
defaultContentType: application/json
channels:
  agent.parse.request.v1:
    description: Java publishes parse request event.
    publish:
      message:
        $ref: '#/components/messages/ParseRequest'
  agent.parse.result.v1:
    description: Agent publishes parse result event.
    publish:
      message:
        $ref: '#/components/messages/ParseResult'
  agent.generate.request.v1:
    description: Java publishes generation request event.
    publish:
      message:
        $ref: '#/components/messages/GenerateRequest'
  agent.generate.result.v1:
    description: Agent publishes generation result event.
    publish:
      message:
        $ref: '#/components/messages/GenerateResult'

components:
  messages:
    ParseRequest:
      name: ParseRequest
      payload:
        type: object
        required: [jobId, tenantId, userId, assetRefs, traceId, schemaVersion]
        properties:
          jobId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          userId:
            type: string
            format: uuid
          assetRefs:
            type: array
            items:
              type: object
              required: [assetId, objectKey, fileType]
              properties:
                assetId:
                  type: string
                  format: uuid
                objectKey:
                  type: string
                fileType:
                  type: string
                  enum: [IMAGE, PDF]
          traceId:
            type: string
          schemaVersion:
            type: string
          idempotencyKey:
            type: string

    ParseResult:
      name: ParseResult
      payload:
        type: object
        required: [jobId, status, confidence, traceId, schemaVersion]
        properties:
          jobId:
            type: string
            format: uuid
          status:
            type: string
            enum: [SUCCESS, FAILED, RETRYING, DEAD_LETTER]
          structuredResult:
            type: object
            additionalProperties: true
          confidence:
            type: number
            minimum: 0
            maximum: 1
          errors:
            type: array
            items:
              type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
          traceId:
            type: string
          schemaVersion:
            type: string

    GenerateRequest:
      name: GenerateRequest
      payload:
        type: object
        required: [taskId, tenantId, recordId, type, traceId, schemaVersion]
        properties:
          taskId:
            type: string
            format: uuid
          tenantId:
            type: string
            format: uuid
          recordId:
            type: string
            format: uuid
          type:
            type: string
            enum: [SUMMARY, MED_PLAN]
          traceId:
            type: string
          schemaVersion:
            type: string
          idempotencyKey:
            type: string

    GenerateResult:
      name: GenerateResult
      payload:
        type: object
        required: [taskId, status, type, traceId]
        properties:
          taskId:
            type: string
            format: uuid
          status:
            type: string
            enum: [SUCCESS, FAILED]
          type:
            type: string
            enum: [SUMMARY, MED_PLAN]
          outputVersion:
            type: integer
          content:
            type: string
          modelMeta:
            type: object
            additionalProperties: true
          errors:
            type: array
            items:
              type: object
              required: [code, message]
              properties:
                code:
                  type: string
                message:
                  type: string
          traceId:
            type: string
